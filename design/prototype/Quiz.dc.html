<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick questions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/caboodle/tokens.css">
<link rel="stylesheet" href="ds/caboodle/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=Gaegu:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#222020}a:hover{color:#6b6466}
</style>
</helmet>
<svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false"><defs>
<filter id="cb-wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<symbol id="cb-suitcase" viewBox="0 0 48 48"><g transform="translate(1.8 1.6)" style="fill: var(--df, #F6C4CA)"><rect x="5" y="16" width="38" height="25" rx="3"></rect></g><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#cb-wobble)"><rect x="5" y="16" width="38" height="25" rx="3"></rect><path d="M18 16v-5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5"></path><path d="M14 16v25M34 16v25"></path><path d="M21 26.5l1.8 1.8 3.6-3.8"></path><circle cx="23.8" cy="27" r="4.6"></circle></g></symbol>
<symbol id="cb-sock" viewBox="0 0 48 48"><g transform="translate(1.8 1.6)" style="fill: var(--df, #BFD9A6)"><path d="M17 5h13v19c0 2 1 3.4 3 5.4l5.6 5.6c3 3 1.8 7.8-2 8.8-2.2.6-4.3-.2-6-2L20 31.6c-2-2-3-4-3-7z"></path></g><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#cb-wobble)"><path d="M17 5h13v19c0 2 1 3.4 3 5.4l5.6 5.6c3 3 1.8 7.8-2 8.8-2.2.6-4.3-.2-6-2L20 31.6c-2-2-3-4-3-7z"></path><path d="M17 11h13M17 14.5h13M30.5 36.5l4.5-4.5"></path></g></symbol>
<symbol id="cb-plug" viewBox="0 0 48 48"><g transform="translate(1.8 1.6)" style="fill: var(--df, #C5E8E4)"><path d="M14 17h20v8a10 10 0 0 1-20 0z"></path></g><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#cb-wobble)"><path d="M14 17h20v8a10 10 0 0 1-20 0z"></path><path d="M19 17V8M29 17V8"></path><path d="M24 35c0 4-3 5-6 6.5s-3.5 4-1 5"></path></g></symbol>
<symbol id="cb-passport" viewBox="0 0 48 48"><g transform="translate(1.8 1.6)" style="fill: var(--df, #F6C4CA)"><rect x="11" y="7" width="25" height="34" rx="3"></rect></g><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#cb-wobble)"><path d="M13 7h20a3 3 0 0 1 3 3v28a3 3 0 0 1-3 3H13a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path><circle cx="23.5" cy="20" r="6"></circle><path d="M23.5 14c-3 3.5-3 8.5 0 12M23.5 14c3 3.5 3 8.5 0 12M17.5 20h12"></path><path d="M18 32h11M20 35.5h7"></path></g></symbol>
<symbol id="cb-backpack" viewBox="0 0 48 48"><g transform="translate(1.8 1.6)" style="fill: var(--df, #D9B79C)"><path d="M13 19a11 11 0 0 1 22 0v19a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4z"></path></g><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#cb-wobble)"><path d="M13 19a11 11 0 0 1 22 0v19a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4z"></path><path d="M19.5 9.2a4.5 4.5 0 0 1 9 0"></path><path d="M13 23h22"></path><rect x="18" y="29" width="12" height="8" rx="1.5"></rect><path d="M24 29v3"></path></g></symbol>
<symbol id="cb-bottle" viewBox="0 0 48 48"><g transform="translate(1.8 1.6)" style="fill: var(--df, #CFE3F3)"><path d="M20 13h8v3.5c3.2 1.2 5 3.4 5 6.5v17a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V23c0-3.1 1.8-5.3 5-6.5z"></path></g><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#cb-wobble)"><path d="M20 13h8v3.5c3.2 1.2 5 3.4 5 6.5v17a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V23c0-3.1 1.8-5.3 5-6.5z"></path><rect x="19" y="5.5" width="10" height="7.5" rx="1.5"></rect><path d="M15 27h18M15 35h18"></path></g></symbol>
</defs></svg>
<div class="cb-stage" style="width: 390px; height: 844px; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Activities.dc.html" class="cb-caption" style="text-decoration: none">‹ back</a>
    <span class="cb-label">Step 3 of 3</span>
  </div>

  <div style="display: flex; gap: 6px" aria-hidden="true">
    <sc-for list="{{dots}}" as="dot" hint-placeholder-count="7">
      <span style="flex: 1; height: 6px; border-radius: var(--radius-pill); border: 1.2px solid var(--ink); background: {{dot.bg}}"></span>
    </sc-for>
  </div>

  <sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
    <div class="cb-quiz" style="max-width: none; gap: 16px">
      <span class="step">Question {{num}} of 7</span>
      <p class="q" style="font-size: 28px"><svg style="width: 44px; height: 44px; color: var(--ink); flex: none" aria-hidden="true"><use href="{{icon}}"></use></svg>{{question}}</p>
      <div class="cb-opts">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
          <button class="cb-opt" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 48px">{{o.label}}</button>
        </sc-for>
      </div>
      <button class="cb-btn cb-btn--text skip" onClick="{{skip}}">Skip</button>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="display: grid; gap: 14px; justify-items: start">
      <h1 style="margin: 0; font: 700 32px/1.05 var(--font-hand)">That's everything!</h1>
      <span class="cb-caption">We'll remember your answers for next time.</span>
      <button class="cb-btn cb-btn--text" onClick="{{restart}}">Change an answer</button>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <a class="cb-btn" href="Packing.dc.html" style="margin-top: auto; justify-content: center; text-decoration: none">Pack my bag</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, answers: {} };
  }
  renderVals() {
    const yesNo = ['Yes', 'Nope'];
    const qs = [
      { q: 'Do you overpack?', icon: '#cb-suitcase', opts: ['I pack light', 'Just right', 'I bring everything, just in case'], last: 'Just right' },
      { q: 'Will you work out?', icon: '#cb-sock', opts: yesNo, last: 'Yes' },
      { q: 'Any fancy dinners?', icon: '#cb-suitcase', opts: yesNo, last: null },
      { q: "Laundry where you're staying?", icon: '#cb-bottle', opts: ['Yes', 'Nope', 'Not sure'], last: 'Nope' },
      { q: 'Working on this trip?', icon: '#cb-plug', opts: yesNo, last: 'Nope' },
      { q: 'Leaving the country?', icon: '#cb-passport', opts: yesNo, last: null },
      { q: 'Carry-on only?', icon: '#cb-backpack', opts: yesNo, last: 'Nope' },
    ];
    const { i, answers } = this.state;
    const done = i >= qs.length;
    const cur = qs[Math.min(i, qs.length - 1)];
    const chosen = answers[i] ?? cur.last;
    const next = (val) => this.setState({ i: i + 1, answers: val === undefined ? answers : { ...answers, [i]: val } });
    return {
      asking: !done,
      done,
      num: i + 1,
      question: cur.q,
      icon: cur.icon,
      options: cur.opts.map((label) => ({ label, on: String(label === chosen), pick: () => next(label) })),
      skip: () => next(undefined),
      restart: () => this.setState({ i: 0 }),
      dots: qs.map((_, k) => ({ bg: k < i ? 'var(--matcha)' : k === i ? 'var(--strawberry)' : 'transparent' })),
    };
  }
}
</script>
</body>
</html>
