<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick dates</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/caboodle/tokens.css">
<link rel="stylesheet" href="ds/caboodle/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=Gaegu:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#222020}a:hover{color:#6b6466}
</style>
</helmet>
<div class="cb-stage" style="width: 390px; height: 844px; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Cities.dc.html" class="cb-caption" style="text-decoration: none">‹ back</a>
    <span class="cb-label">Step 2 of 4</span>
  </div>

  <h1 style="margin: 0; font: 700 30px/1.05 var(--font-hand)">When are you in Kyoto?</h1>

  <div style="display: grid; gap: 6px">
    <div style="display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); padding: 6px 0">
      <span style="font: 700 20px/1 var(--font-hand); flex: 1">Tokyo</span>
      <span class="cb-caption">Dec 10 – Dec 13 · 3 nights</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); padding: 6px 0">
      <span style="font: 700 20px/1 var(--font-hand); flex: 1">Kyoto</span>
      <span class="cb-caption" style="color: var(--pen)">{{kyotoShort}}</span>
    </div>
  </div>

  <div class="cb-cal" style="max-width: none">
    <div class="cb-cal-head"><span aria-hidden="true">‹</span><b>December 2026</b><span aria-hidden="true">›</span></div>
    <div class="cb-cal-grid">
      <span class="dow">M</span><span class="dow">T</span><span class="dow">W</span><span class="dow">T</span><span class="dow">F</span><span class="dow">S</span><span class="dow">S</span>
      <span class="cb-day out" style="display: grid; place-items: center">30</span>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="31">
        <button class="{{d.cls}}" onClick="{{d.pick}}" aria-pressed="{{d.on}}">{{d.n}}</button>
      </sc-for>
      <span class="cb-day out" style="display: grid; place-items: center">1</span>
      <span class="cb-day out" style="display: grid; place-items: center">2</span>
      <span class="cb-day out" style="display: grid; place-items: center">3</span>
    </div>
    <div class="cb-cal-foot">{{footer}}</div>
  </div>

  <p class="cb-why" style="margin: 0">tap the day you arrive, then the day you leave. Tokyo's days are shaded.</p>

  <div style="margin-top: auto; display: grid; gap: 10px">
    <span class="cb-caption" style="text-align: center">Whole trip: {{whole}}</span>
    <a class="cb-btn" href="Activities.dc.html" style="justify-content: center; text-decoration: none">Next: what are you up to?</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { start: 13, end: 15, picking: 'start' };
  }
  renderVals() {
    const { start, end, picking } = this.state;
    const pick = (n) => () => {
      if (picking === 'start' || n < start) this.setState({ start: n, end: null, picking: 'end' });
      else this.setState({ end: n, picking: 'start' });
    };
    const days = [];
    for (let n = 1; n <= 31; n++) {
      let cls = 'cb-day';
      const isTokyo = n > 10 && n < 13;
      if (n === start) cls += ' start';
      else if (end && n === end) cls += ' end';
      else if (end && n > start && n < end) cls += ' in-range';
      else if (n === 10 || n === 13) cls += ' in-range';
      else if (isTokyo) cls += ' in-range';
      days.push({ n, cls, on: String(n === start || n === end), pick: pick(n) });
    }
    const nights = end ? end - start : 0;
    const kyotoShort = end ? 'Dec ' + start + ' – Dec ' + end + ' · ' + nights + (nights === 1 ? ' night' : ' nights') : 'Dec ' + start + ' – ?';
    const lastDay = end || start;
    const total = lastDay - 10;
    return {
      days,
      kyotoShort,
      footer: end ? 'Kyoto · ' + kyotoShort : 'Now tap the day you leave Kyoto',
      whole: 'Dec 10 – Dec ' + lastDay + ' · ' + total + ' nights · ' + (total + 1) + ' days',
    };
  }
}
</script>
</body>
</html>
